name: Release

on:
  push:
    tags: ['v*']
  # Manual runs validate and build only; they never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1
      - name: Validate release version
        run: node scripts/release.mjs validate
      - name: Install locked dependencies
        run: npm ci
      - name: Test release safeguards
        run: node --test scripts/release.test.mjs
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Pack and prepare release notes
        run: node scripts/release.mjs pack
      - name: Publish npm package with OIDC
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node scripts/release.mjs npm
      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node scripts/release.mjs github
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Summarize validation
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Validation, build, tests and packaging passed. No npm package or GitHub Release was published.' >> "$GITHUB_STEP_SUMMARY"
