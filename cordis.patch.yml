# orca-maid skin bundle patch: inserts its public dsh.client entry into the web plugin roster.
# The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path-or-git-url>`. Enable only one skin.
# ABYSS owns its appearance controls and browser-local preferences.
- insert:
    - id: ui-skin-orca-maid
      name: '@bendix400/dsh-client-ui-skin-orca-maid'
